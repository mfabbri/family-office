# Family Office AI - token-aware Codex routing.
# Exact GPT-5.6 model IDs are used because ChatGPT-authenticated Codex may reject the unsuffixed alias.
# Default: Terra for balanced intelligence/cost. GPT-5.5 remains available as compatibility fallback.
model = "gpt-5.6-terra"
model_reasoning_effort = "medium"
model_verbosity = "low"
plan_mode_reasoning_effort = "high"

[agents]
enabled = true
max_concurrent_threads_per_session = 2
interrupt_message = false
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "low"

[agents.fo_explorer]
description = "Read-only narrow repository exploration and inventory. Prefer for bounded scans and repetitive discovery."
config_file = "agents/fo-explorer.toml"

[agents.fo_planner]
description = "Read-only architecture and implementation planner for cross-module changes; returns a compact execution plan."
config_file = "agents/fo-planner.toml"

[agents.fo_reviewer]
description = "Independent technical reviewer for correctness, regressions, contracts, privacy, and missing tests."
config_file = "agents/fo-reviewer.toml"

[agents.fo_financial_reviewer]
description = "Independent reviewer for investment mathematics, leverage, cash-flow, scenario assumptions, and opportunity-cost logic."
config_file = "agents/fo-financial-reviewer.toml"

[agents.fo_normative_reviewer]
description = "Independent reviewer for tax, pension, legal/compliance, temporal validity, and rule-pack traceability."
config_file = "agents/fo-normative-reviewer.toml"

[profiles.standard]
model = "gpt-5.6-terra"
model_reasoning_effort = "medium"
model_verbosity = "low"

[profiles.economy]
model = "gpt-5.6-luna"
model_reasoning_effort = "low"
model_verbosity = "low"

[profiles.deep]
model = "gpt-5.6-sol"
model_reasoning_effort = "high"
model_verbosity = "low"

[profiles.critical]
model = "gpt-5.6-sol"
model_reasoning_effort = "xhigh"
model_verbosity = "low"

[profiles.fallback55]
model = "gpt-5.5"
model_reasoning_effort = "medium"
model_verbosity = "low"

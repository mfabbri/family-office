# Hybrid model routing for ChatGPT-authenticated Codex.
# Keep the main session on GPT-5.5; use exact GPT-5.6 model IDs for profiles and specialist subagents.
model = "gpt-5.5"
model_reasoning_effort = "medium"
plan_mode_reasoning_effort = "high"

[agents]
max_threads = 3
max_depth = 1

[agents.fo_explorer]
description = "Read-only repository exploration for narrow discovery tasks."
config_file = "agents/fo-explorer.toml"

[agents.fo_reviewer]
description = "Independent technical review for complex or cross-module changes."
config_file = "agents/fo-reviewer.toml"

[agents.fo_normative_reviewer]
description = "Independent review for tax, pension, financial, and compliance-sensitive changes."
config_file = "agents/fo-normative-reviewer.toml"

[profiles.standard]
model = "gpt-5.5"
model_reasoning_effort = "medium"

[profiles.luna]
model = "gpt-5.6-luna"
model_reasoning_effort = "low"

[profiles.terra]
model = "gpt-5.6-terra"
model_reasoning_effort = "medium"

[profiles.sol]
model = "gpt-5.6-sol"
model_reasoning_effort = "high"
